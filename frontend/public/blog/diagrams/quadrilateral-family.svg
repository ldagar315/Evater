<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 284" role="img" aria-label="Family map of quadrilaterals drawn as nested regions: the trapezium region contains the parallelogram region; inside it the rectangle and rhombus regions overlap only in the square region; the kite region contains the whole rhombus region and extends beyond the trapezium region">
  <rect x="0" y="0" width="460" height="284" fill="#fbfaf3"/>
  <!-- Trapezium: at least one pair of parallel sides (inclusive) -->
  <rect x="20" y="28" width="248" height="212" rx="10" fill="rgba(55,194,163,0.05)" stroke="#272426" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="36" y="52" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#272426">Trapezium</text>
  <!-- Parallelogram -->
  <rect x="44" y="64" width="224" height="152" rx="10" fill="rgba(55,194,163,0.07)" stroke="#272426" stroke-width="2"/>
  <text x="58" y="205" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#272426">Parallelogram</text>
  <!-- Kite: contains the rhombus exactly, reaches outside the trapezium -->
  <rect x="164" y="96" width="216" height="72" rx="10" fill="none" stroke="#272426" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="332" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#272426">Kite</text>
  <!-- Rectangle -->
  <rect x="68" y="96" width="128" height="72" rx="10" fill="#fbfaf3" stroke="#272426" stroke-width="1.5"/>
  <text x="108" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#272426">Rectangle</text>
  <!-- Rhombus -->
  <rect x="164" y="96" width="104" height="72" rx="10" fill="none" stroke="#272426" stroke-width="1.5"/>
  <text x="230" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#272426">Rhombus</text>
  <!-- Square: exactly the rectangle-rhombus overlap -->
  <rect x="174" y="120" width="12" height="12" fill="#37c2a3" stroke="#272426" stroke-width="1.5"/>
  <line x1="180" y1="168" x2="180" y2="186" stroke="#585254" stroke-width="1"/>
  <text x="204" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#272426">Square</text>
  <text x="230" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#585254">Ganita Prakash definitions are inclusive:</text>
  <text x="230" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#585254">every parallelogram is a trapezium, every rhombus is a kite</text>
</svg>
