<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" role="img" aria-label="Reflection at a plane mirror: incident and reflected rays make equal 30 degree angles with the normal">
  <rect x="0" y="0" width="440" height="240" fill="#fbfaf3"/>
  <!-- normal -->
  <line x1="220" y1="190" x2="220" y2="46" stroke="#272426" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="228" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#272426">Normal</text>
  <!-- incident ray (arrow toward mirror) -->
  <line x1="150" y1="69" x2="210" y2="181" stroke="#37c2a3" stroke-width="2.5"/>
  <polygon points="222,192 207,181 218,176" fill="#37c2a3"/>
  <text x="92" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#272426">Incident ray</text>
  <!-- reflected ray (arrow away from mirror) -->
  <line x1="226" y1="181" x2="284" y2="76" stroke="#37c2a3" stroke-width="2.5"/>
  <polygon points="291,66 276,77 287,82" fill="#37c2a3"/>
  <text x="296" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#272426">Reflected ray</text>
  <!-- angle arcs -->
  <path d="M 220 150 A 40 40 0 0 0 200 155.4" fill="none" stroke="#272426" stroke-width="1.5"/>
  <path d="M 220 150 A 40 40 0 0 1 240 155.4" fill="none" stroke="#272426" stroke-width="1.5"/>
  <text x="172" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#272426">i = 30&#176;</text>
  <text x="240" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#272426">r = 30&#176;</text>
  <!-- mirror -->
  <line x1="40" y1="190" x2="400" y2="190" stroke="#272426" stroke-width="3"/>
  <g stroke="#272426" stroke-width="1">
    <line x1="60" y1="190" x2="50" y2="200"/><line x1="90" y1="190" x2="80" y2="200"/>
    <line x1="120" y1="190" x2="110" y2="200"/><line x1="150" y1="190" x2="140" y2="200"/>
    <line x1="180" y1="190" x2="170" y2="200"/><line x1="210" y1="190" x2="200" y2="200"/>
    <line x1="240" y1="190" x2="230" y2="200"/><line x1="270" y1="190" x2="260" y2="200"/>
    <line x1="300" y1="190" x2="290" y2="200"/><line x1="330" y1="190" x2="320" y2="200"/>
    <line x1="360" y1="190" x2="350" y2="200"/><line x1="390" y1="190" x2="380" y2="200"/>
  </g>
  <text x="322" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#272426">Plane mirror</text>
  <!-- law note -->
  <text x="220" y="24" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#272426">Angle of incidence = angle of reflection (i = r)</text>
</svg>
