<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 510"><rect width="400" height="510" rx="16" fill="#edf7f2"/><g font-family="sans-serif" fill="#153e36"><text x="20" y="35" font-size="21" font-weight="700">A power ladder</text><text x="20" y="65" font-size="18">Each step down multiplies by 2.</text><text x="80" y="105" font-size="24">2⁻²</text><text x="170" y="105" font-size="24">=</text><text x="235" y="105" font-size="24">1/4</text><text x="80" y="148" font-size="24">2⁻¹</text><text x="170" y="148" font-size="24">=</text><text x="235" y="148" font-size="24">1/2</text><text x="80" y="191" font-size="24">2⁰</text><text x="170" y="191" font-size="24">=</text><text x="235" y="191" font-size="24">1</text><text x="80" y="234" font-size="24">2¹</text><text x="170" y="234" font-size="24">=</text><text x="235" y="234" font-size="24">2</text><text x="80" y="277" font-size="24">2²</text><text x="170" y="277" font-size="24">=</text><text x="235" y="277" font-size="24">4</text><text x="80" y="320" font-size="24">2³</text><text x="170" y="320" font-size="24">=</text><text x="235" y="320" font-size="24">8</text><text x="80" y="363" font-size="24">2⁴</text><text x="170" y="363" font-size="24">=</text><text x="235" y="363" font-size="24">16</text><rect x="15" y="400" width="370" height="95" rx="10" fill="white"/><text x="28" y="435" font-size="21">2³ + 2⁴ = 8 + 16 = 24</text><text x="28" y="475" font-size="21">2³ × 2⁴ = 2⁷ = 128</text></g></svg>
