<svg xmlns="http://www.w3.org/2000/svg" viewBox="-135 -295 430 500" role="img" aria-label="A 3-4-5 right-angled triangle with a square drawn outward on each side: areas 9, 16 and 25, showing 9 + 16 = 25">
  <rect x="-135" y="-295" width="430" height="500" fill="#fbfaf3"/>
  <!-- exact geometry: 1 unit = 40 px; legs 3u = 120 px and 4u = 160 px, hypotenuse 5u = 200 px -->
  <!-- right angle at O=(0,0); B=(0,-120); C=(160,0) -->
  <!-- square on the 3-side (outward, left) -->
  <polygon points="0,0 0,-120 -120,-120 -120,0" fill="rgba(55,194,163,0.10)" stroke="#37c2a3" stroke-width="2"/>
  <!-- square on the 4-side (outward, below) -->
  <polygon points="0,0 160,0 160,160 0,160" fill="rgba(55,194,163,0.10)" stroke="#37c2a3" stroke-width="2"/>
  <!-- square on the 5-side (outward, upper right; edge (160,120), outward normal (120,-160)) -->
  <polygon points="0,-120 160,0 280,-160 120,-280" fill="rgba(55,194,163,0.10)" stroke="#37c2a3" stroke-width="2"/>
  <!-- the triangle -->
  <polygon points="0,0 0,-120 160,0" fill="#fbfaf3" stroke="#272426" stroke-width="2.5"/>
  <!-- right-angle marker -->
  <polyline points="0,-24 24,-24 24,0" fill="none" stroke="#272426" stroke-width="1.5"/>
  <!-- side labels -->
  <text x="12" y="-64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#272426">3</text>
  <text x="80" y="-12" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#272426">4</text>
  <text x="70" y="-42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#272426">5</text>
  <!-- area labels -->
  <text x="-60" y="-54" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#272426">3&#178; = 9</text>
  <text x="80" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#272426">4&#178; = 16</text>
  <text x="140" y="-134" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#272426">5&#178; = 25</text>
  <!-- equality note -->
  <text x="80" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#272426">9 + 16 = 25, so a&#178; + b&#178; = c&#178;</text>
</svg>
