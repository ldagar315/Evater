<svg xmlns="http://www.w3.org/2000/svg" viewBox="-135 -175 475 545" role="img" aria-label="A 3-4-5 right-angled triangle with squares on each side showing areas 9, 16 and 25">
  <rect x="-135" y="-175" width="475" height="545" fill="#fbfaf3"/>
  <!-- squares on each side -->
  <polygon points="0,160 0,0 -120,0 -120,160" fill="rgba(55,194,163,0.10)" stroke="#37c2a3" stroke-width="2"/>
  <polygon points="0,160 160,160 160,320 0,320" fill="rgba(55,194,163,0.10)" stroke="#37c2a3" stroke-width="2"/>
  <polygon points="0,0 160,160 320,0 160,-160" fill="rgba(55,194,163,0.10)" stroke="#37c2a3" stroke-width="2"/>
  <!-- the triangle -->
  <polygon points="0,160 0,0 160,160" fill="#fbfaf3" stroke="#272426" stroke-width="2.5"/>
  <!-- right-angle marker -->
  <polyline points="0,136 24,136 24,160" fill="none" stroke="#272426" stroke-width="1.5"/>
  <!-- side labels -->
  <text x="14" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#272426">3</text>
  <text x="76" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#272426">4</text>
  <text x="58" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#272426">5</text>
  <!-- area labels -->
  <text x="-60" y="74" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#272426">3&#178; = 9</text>
  <text x="80" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#272426">4&#178; = 16</text>
  <text x="160" y="-6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#272426">5&#178; = 25</text>
  <!-- equality note -->
  <text x="80" y="352" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#272426">9 + 16 = 25, so a&#178; + b&#178; = c&#178;</text>
</svg>
