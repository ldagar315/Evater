<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" role="img" aria-label="A 4 by 4 square of 16 small squares next to a 3 by 3 by 3 cube of 27 small cubes">
  <rect x="0" y="0" width="460" height="210" fill="#fbfaf3"/>
  <!-- 4x4 square -->
  <rect x="30" y="20" width="120" height="120" fill="rgba(55,194,163,0.10)" stroke="#272426" stroke-width="2"/>
  <g stroke="#37c2a3" stroke-width="1.2">
    <line x1="60" y1="20" x2="60" y2="140"/><line x1="90" y1="20" x2="90" y2="140"/><line x1="120" y1="20" x2="120" y2="140"/>
    <line x1="30" y1="50" x2="150" y2="50"/><line x1="30" y1="80" x2="150" y2="80"/><line x1="30" y1="110" x2="150" y2="110"/>
  </g>
  <text x="90" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#272426">4&#178; = 16 small squares</text>
  <text x="90" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#272426">4 rows of 4</text>
  <!-- 3x3x3 cube -->
  <g stroke="#272426" stroke-width="2" fill="rgba(55,194,163,0.10)">
    <polygon points="260,70 350,70 350,160 260,160"/>
    <polygon points="260,70 295,45 385,45 350,70"/>
    <polygon points="350,70 385,45 385,135 350,160"/>
  </g>
  <!-- front face grid -->
  <g stroke="#37c2a3" stroke-width="1.2">
    <line x1="290" y1="70" x2="290" y2="160"/><line x1="320" y1="70" x2="320" y2="160"/>
    <line x1="260" y1="100" x2="350" y2="100"/><line x1="260" y1="130" x2="350" y2="130"/>
  </g>
  <!-- top face grid -->
  <g stroke="#37c2a3" stroke-width="1.2">
    <line x1="272" y1="61.7" x2="362" y2="61.7"/><line x1="283" y1="53.3" x2="373" y2="53.3"/>
    <line x1="290" y1="70" x2="325" y2="45"/><line x1="320" y1="70" x2="355" y2="45"/>
  </g>
  <!-- right face grid -->
  <g stroke="#37c2a3" stroke-width="1.2">
    <line x1="361.7" y1="61.7" x2="361.7" y2="151.7"/><line x1="373.3" y1="53.3" x2="373.3" y2="143.3"/>
    <line x1="350" y1="100" x2="385" y2="75"/><line x1="350" y1="130" x2="385" y2="105"/>
  </g>
  <text x="322" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#272426">3&#179; = 27 small cubes</text>
  <text x="322" y="203" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#272426">3 layers of 3 &#215; 3</text>
</svg>
