<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 686" role="img"><title>Ask what the sample contains</title><rect width="480" height="686" rx="20" fill="#faf8f2"/><text x="24" y="48" font-family="sans-serif" font-size="28" font-weight="700" fill="#173b38">Ask what the sample contains</text><rect x="18" y="82" width="444" height="138" rx="14" fill="#deeee6"/><text x="34" y="118" font-family="sans-serif" font-size="27" font-weight="700" fill="#173b38">Element: a pure substance</text><text x="34" y="156" font-family="sans-serif" font-size="25" fill="#173b38">One kind of atom.</text><text x="34" y="188" font-family="sans-serif" font-size="25" fill="#173b38">Oxygen is still an element as O₂.</text><rect x="18" y="242" width="444" height="138" rx="14" fill="#deeee6"/><text x="34" y="278" font-family="sans-serif" font-size="27" font-weight="700" fill="#173b38">Compound: a pure substance</text><text x="34" y="316" font-family="sans-serif" font-size="25" fill="#173b38">Different elements chemically</text><text x="34" y="348" font-family="sans-serif" font-size="25" fill="#173b38">combined in a fixed ratio.</text><rect x="18" y="402" width="444" height="138" rx="14" fill="#deeee6"/><text x="34" y="438" font-family="sans-serif" font-size="27" font-weight="700" fill="#173b38">Mixture: several substances</text><text x="34" y="476" font-family="sans-serif" font-size="25" fill="#173b38">Uniform or non-uniform.</text><text x="34" y="508" font-family="sans-serif" font-size="25" fill="#173b38">Proportions can vary.</text><text x="24" y="631" font-family="sans-serif" font-size="23" fill="#435c56">Uniform appearance does not prove purity.</text><text x="24" y="661" font-family="sans-serif" font-size="23" fill="#435c56">Use composition and separation evidence.</text></svg>
