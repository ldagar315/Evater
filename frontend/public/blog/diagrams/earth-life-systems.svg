<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 686" role="img"><title>Connect the systems</title><rect width="480" height="686" rx="20" fill="#faf8f2"/><text x="24" y="48" font-family="sans-serif" font-size="26" font-weight="700" fill="#173b38">Connect the systems</text><rect x="18" y="82" width="444" height="138" rx="14" fill="#deeee6"/><text x="32" y="118" font-family="sans-serif" font-size="25" font-weight="700" fill="#173b38">Air, water and solid Earth</text><text x="32" y="156" font-family="sans-serif" font-size="24" fill="#173b38">Atmosphere, hydrosphere,</text><text x="32" y="188" font-family="sans-serif" font-size="24" fill="#173b38">and geosphere interact.</text><rect x="18" y="242" width="444" height="138" rx="14" fill="#deeee6"/><text x="32" y="278" font-family="sans-serif" font-size="25" font-weight="700" fill="#173b38">Life and its surroundings</text><text x="32" y="316" font-family="sans-serif" font-size="24" fill="#173b38">The biosphere overlaps them.</text><text x="32" y="348" font-family="sans-serif" font-size="24" fill="#173b38">These are not sealed boxes.</text><rect x="18" y="402" width="444" height="138" rx="14" fill="#deeee6"/><text x="32" y="438" font-family="sans-serif" font-size="25" font-weight="700" fill="#173b38">New organisms continue life</text><text x="32" y="476" font-family="sans-serif" font-size="24" fill="#173b38">Gamete fusion → zygote → embryo.</text><text x="32" y="508" font-family="sans-serif" font-size="24" fill="#173b38">Pollination is pollen transfer.</text><text x="24" y="631" font-family="sans-serif" font-size="22" fill="#435c56">Pollen grain ≠ male gamete.</text><text x="24" y="661" font-family="sans-serif" font-size="22" fill="#435c56">Ovule ≠ egg cell.</text></svg>
