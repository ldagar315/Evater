<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 686" role="img"><title>Different cycles, different clocks</title><rect width="480" height="686" rx="20" fill="#faf8f2"/><text x="24" y="48" font-family="sans-serif" font-size="26" font-weight="700" fill="#173b38">Different cycles, different clocks</text><rect x="18" y="82" width="444" height="138" rx="14" fill="#deeee6"/><text x="32" y="118" font-family="sans-serif" font-size="25" font-weight="700" fill="#173b38">Mean solar day</text><text x="32" y="156" font-family="sans-serif" font-size="24" fill="#173b38">24 hours on average.</text><text x="32" y="188" font-family="sans-serif" font-size="24" fill="#173b38">Linked to Earth’s rotation.</text><rect x="18" y="242" width="444" height="138" rx="14" fill="#deeee6"/><text x="32" y="278" font-family="sans-serif" font-size="25" font-weight="700" fill="#173b38">Lunar phase cycle</text><text x="32" y="316" font-family="sans-serif" font-size="24" fill="#173b38">About 29.5 days.</text><text x="32" y="348" font-family="sans-serif" font-size="24" fill="#173b38">Our view of the sunlit Moon changes.</text><rect x="18" y="402" width="444" height="138" rx="14" fill="#deeee6"/><text x="32" y="438" font-family="sans-serif" font-size="25" font-weight="700" fill="#173b38">Seasonal year</text><text x="32" y="476" font-family="sans-serif" font-size="24" fill="#173b38">About 365.25 days.</text><text x="32" y="508" font-family="sans-serif" font-size="24" fill="#173b38">Not exactly 12 lunar months.</text><text x="24" y="631" font-family="sans-serif" font-size="22" fill="#435c56">Rounded teaching values, not an ephemeris.</text><text x="24" y="661" font-family="sans-serif" font-size="22" fill="#435c56">Phases are not caused by Earth’s shadow.</text></svg>
