<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 686" role="img"><title>Two pressure comparisons</title><rect width="480" height="686" rx="20" fill="#faf8f2"/><text x="24" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#173b38">Two pressure comparisons</text><rect x="18" y="82" width="444" height="138" rx="14" fill="#deeee6"/><text x="34" y="118" font-family="sans-serif" font-size="27" font-weight="700" fill="#173b38">Keep force the same</text><text x="34" y="156" font-family="sans-serif" font-size="25" fill="#173b38">Smaller area: higher pressure.</text><text x="34" y="188" font-family="sans-serif" font-size="25" fill="#173b38">Larger area: lower pressure.</text><rect x="18" y="242" width="444" height="138" rx="14" fill="#deeee6"/><text x="34" y="278" font-family="sans-serif" font-size="27" font-weight="700" fill="#173b38">Keep area the same</text><text x="34" y="316" font-family="sans-serif" font-size="25" fill="#173b38">More force: higher pressure.</text><text x="34" y="348" font-family="sans-serif" font-size="25" fill="#173b38">Less force: lower pressure.</text><rect x="18" y="402" width="444" height="138" rx="14" fill="#deeee6"/><text x="34" y="438" font-family="sans-serif" font-size="27" font-weight="700" fill="#173b38">Air can move</text><text x="34" y="476" font-family="sans-serif" font-size="25" fill="#173b38">Higher pressure → lower pressure</text><text x="34" y="508" font-family="sans-serif" font-size="25" fill="#173b38">is the starting model for wind.</text><text x="24" y="631" font-family="sans-serif" font-size="23" fill="#435c56">Pressure = perpendicular force / area</text><text x="24" y="661" font-family="sans-serif" font-size="23" fill="#435c56">1 pascal = 1 newton / square metre</text></svg>
