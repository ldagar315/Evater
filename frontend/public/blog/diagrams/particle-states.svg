<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 756" role="img"><title>Particle arrangements in three states</title><rect width="480" height="756" rx="20" fill="#faf8f2"/><text x="24" y="44" font-family="sans-serif" font-size="28" font-weight="700" fill="#173b38">Same particles, new arrangement</text><rect x="18" y="72" width="444" height="185" rx="14" fill="#deeee6"/><text x="32" y="108" font-family="sans-serif" font-size="28" font-weight="700" fill="#173b38">Solid</text><circle cx="60" cy="137" r="9" fill="#27625b"/><circle cx="95" cy="137" r="9" fill="#27625b"/><circle cx="130" cy="137" r="9" fill="#27625b"/><circle cx="165" cy="137" r="9" fill="#27625b"/><circle cx="200" cy="137" r="9" fill="#27625b"/><circle cx="60" cy="165" r="9" fill="#27625b"/><circle cx="95" cy="165" r="9" fill="#27625b"/><circle cx="130" cy="165" r="9" fill="#27625b"/><circle cx="165" cy="165" r="9" fill="#27625b"/><circle cx="200" cy="165" r="9" fill="#27625b"/><circle cx="60" cy="193" r="9" fill="#27625b"/><circle cx="95" cy="193" r="9" fill="#27625b"/><circle cx="130" cy="193" r="9" fill="#27625b"/><circle cx="165" cy="193" r="9" fill="#27625b"/><circle cx="200" cy="193" r="9" fill="#27625b"/><text x="32" y="243" font-family="sans-serif" font-size="24" fill="#173b38">Close; vibrate about positions</text><rect x="18" y="277" width="444" height="185" rx="14" fill="#deeee6"/><text x="32" y="313" font-family="sans-serif" font-size="28" font-weight="700" fill="#173b38">Liquid</text><circle cx="60" cy="350" r="9" fill="#27625b"/><circle cx="100" cy="342" r="9" fill="#27625b"/><circle cx="131" cy="357" r="9" fill="#27625b"/><circle cx="171" cy="348" r="9" fill="#27625b"/><circle cx="204" cy="368" r="9" fill="#27625b"/><circle cx="75" cy="383" r="9" fill="#27625b"/><circle cx="112" cy="388" r="9" fill="#27625b"/><circle cx="147" cy="383" r="9" fill="#27625b"/><circle cx="180" cy="401" r="9" fill="#27625b"/><circle cx="219" cy="399" r="9" fill="#27625b"/><circle cx="55" cy="410" r="9" fill="#27625b"/><circle cx="99" cy="416" r="9" fill="#27625b"/><circle cx="141" cy="414" r="9" fill="#27625b"/><circle cx="209" cy="339" r="9" fill="#27625b"/><circle cx="242" cy="375" r="9" fill="#27625b"/><text x="32" y="448" font-family="sans-serif" font-size="24" fill="#173b38">Close; move past one another</text><rect x="18" y="482" width="444" height="185" rx="14" fill="#deeee6"/><text x="32" y="518" font-family="sans-serif" font-size="28" font-weight="700" fill="#173b38">Gas</text><circle cx="55" cy="548" r="9" fill="#27625b"/><circle cx="204" cy="574" r="9" fill="#27625b"/><circle cx="391" cy="553" r="9" fill="#27625b"/><circle cx="114" cy="619" r="9" fill="#27625b"/><circle cx="315" cy="610" r="9" fill="#27625b"/><circle cx="243" cy="543" r="9" fill="#27625b"/><text x="32" y="653" font-family="sans-serif" font-size="24" fill="#173b38">Far apart; move freely</text><text x="24" y="718" font-family="sans-serif" font-size="23" fill="#435c56">Schematic, not to scale. Ice is an exception</text><text x="24" y="746" font-family="sans-serif" font-size="23" fill="#435c56">to the usual solid/liquid spacing comparison.</text></svg>
