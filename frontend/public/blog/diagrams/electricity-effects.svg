<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 686" role="img"><title>Control a magnetic effect</title><rect width="480" height="686" rx="20" fill="#faf8f2"/><text x="24" y="48" font-family="sans-serif" font-size="29" font-weight="700" fill="#173b38">Control a magnetic effect</text><rect x="18" y="82" width="444" height="138" rx="14" fill="#deeee6"/><text x="34" y="118" font-family="sans-serif" font-size="27" font-weight="700" fill="#173b38">Current ON</text><text x="34" y="156" font-family="sans-serif" font-size="25" fill="#173b38">A coil produces a magnetic field.</text><text x="34" y="188" font-family="sans-serif" font-size="25" fill="#173b38">An iron core strengthens it.</text><rect x="18" y="242" width="444" height="138" rx="14" fill="#deeee6"/><text x="34" y="278" font-family="sans-serif" font-size="27" font-weight="700" fill="#173b38">Current reversed</text><text x="34" y="316" font-family="sans-serif" font-size="25" fill="#173b38">The magnetic poles reverse.</text><text x="34" y="348" font-family="sans-serif" font-size="25" fill="#173b38">North and south swap ends.</text><rect x="18" y="402" width="444" height="138" rx="14" fill="#deeee6"/><text x="34" y="438" font-family="sans-serif" font-size="27" font-weight="700" fill="#173b38">Current OFF</text><text x="34" y="476" font-family="sans-serif" font-size="25" fill="#173b38">The field due to current stops.</text><text x="34" y="508" font-family="sans-serif" font-size="25" fill="#173b38">A lifting model releases clips.</text><text x="24" y="631" font-family="sans-serif" font-size="23" fill="#435c56">Concept model, not wiring instructions.</text><text x="24" y="661" font-family="sans-serif" font-size="23" fill="#435c56">Use teacher-led demonstrations only.</text></svg>
