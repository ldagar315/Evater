<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 686" role="img"><title>Measure, subtract, divide</title><rect width="480" height="686" rx="20" fill="#faf8f2"/><text x="24" y="48" font-family="sans-serif" font-size="28" font-weight="700" fill="#173b38">Measure, subtract, divide</text><rect x="18" y="82" width="444" height="138" rx="14" fill="#deeee6"/><text x="34" y="118" font-family="sans-serif" font-size="27" font-weight="700" fill="#173b38">1. Measure mass</text><text x="34" y="156" font-family="sans-serif" font-size="25" fill="#173b38">Object mass = 54 g</text><text x="34" y="188" font-family="sans-serif" font-size="25" fill="#173b38">Tare the empty holder first.</text><rect x="18" y="242" width="444" height="138" rx="14" fill="#deeee6"/><text x="34" y="278" font-family="sans-serif" font-size="27" font-weight="700" fill="#173b38">2. Find object volume</text><text x="34" y="316" font-family="sans-serif" font-size="25" fill="#173b38">Cylinder rise = 58 - 40 = 18 mL</text><text x="34" y="348" font-family="sans-serif" font-size="25" fill="#173b38">18 mL = 18 cm³</text><rect x="18" y="402" width="444" height="138" rx="14" fill="#deeee6"/><text x="34" y="438" font-family="sans-serif" font-size="27" font-weight="700" fill="#173b38">3. Calculate density</text><text x="34" y="476" font-family="sans-serif" font-size="25" fill="#173b38">Density = 54 / 18 = 3 g/cm³</text><text x="34" y="508" font-family="sans-serif" font-size="25" fill="#173b38">Not 54 / 58. Use the rise.</text><text x="24" y="631" font-family="sans-serif" font-size="23" fill="#435c56">Original example. Suitable insoluble solid.</text><text x="24" y="661" font-family="sans-serif" font-size="23" fill="#435c56">Fully immersed; no trapped air or spilling.</text></svg>
