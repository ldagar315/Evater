[build]
functions = "netlify/functions"
publish = "dist"
# Install the Chrome build that matches the pinned puppeteer before building;
# Netlify's build image does not ship one and its node_modules cache skips
# puppeteer's postinstall download. The cache directory persists across builds.
command = "npx puppeteer browsers install chrome && npx vite build"

[build.environment]
PUPPETEER_CACHE_DIRECTORY = "/opt/build/cache/puppeteer"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

# SPA fallback - this is crucial for React Router
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
